services:
  - type: web
    name: campus-marketplace-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////var/data/campus_marketplace.db
    disk:
      name: campus-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: campus-marketplace-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Point at the API service's public URL; Render appends a suffix if the
      # name is taken, so confirm it in the dashboard after the first deploy.
      - key: VITE_API_BASE
        value: https://campus-marketplace-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
